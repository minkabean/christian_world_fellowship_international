<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Thank You — Christian World Fellowship International</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
    --navy:#16233F;
    --navy-light:#223256;
    --gold:#C79A3E;
    --gold-light:#E4C875;
    --cream:#FAF6ED;
    --ink:#2A2A28;
    --ink-soft:#5B5A54;
    --white:#FFFFFF;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Inter',system-ui,sans-serif;
    color:var(--ink);
    background:var(--cream);
    line-height:1.6;
  }
  h1,h2,h3{font-family:'Fraunces',Georgia,serif;font-weight:500;color:var(--navy);}
  .eyebrow{
    font-family:'Inter',sans-serif;
    font-size:13px;
    font-weight:600;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--gold);
  }
  a{text-decoration:none;color:inherit;}
  .btn{
    display:inline-block;
    padding:13px 28px;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:14px;
    letter-spacing:.02em;
    border-radius:3px;
    border:1.5px solid transparent;
  }
  .btn-gold{background:var(--gold);color:var(--navy);}
  .btn-outline{border-color:rgba(255,255,255,.7);color:var(--white);}

  /* nav */
  .nav{background:var(--navy);padding:18px 0;}
  .nav-inner{max-width:1100px;margin:0 auto;padding:0 32px;display:flex;align-items:center;justify-content:space-between;gap:24px;}
  .brand{display:flex;align-items:center;gap:12px;}
  .logo-mark{width:46px;height:46px;border-radius:50%;background:var(--white);flex-shrink:0;
    display:flex;align-items:center;justify-content:center;overflow:hidden;padding:3px;}
  .logo-mark img{width:100%;height:100%;object-fit:contain;}
  .brand-text{display:flex;flex-direction:column;line-height:1.25;}
  .brand-name{font-family:'Fraunces',serif;color:var(--white);font-size:15px;font-weight:500;}
  .brand-sub{font-size:11px;letter-spacing:.16em;color:var(--gold-light);text-transform:uppercase;}
  .nav-links{display:flex;gap:26px;font-size:14px;color:rgba(255,255,255,.85);}
  .nav-links a:hover{color:var(--gold-light);}
.site-footer{background:var(--navy);color:rgba(255,255,255,.65);margin-top:8px;}
  .footer-inner{max-width:1100px;margin:0 auto;padding:48px 32px;display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:36px;font-size:13.5px;}
  .footer-inner h4{color:var(--gold-light);font-family:'Inter',sans-serif;font-size:12px;letter-spacing:.1em;
    text-transform:uppercase;margin-bottom:14px;font-weight:600;}
  .footer-inner p, .footer-inner a{display:block;margin-bottom:8px;color:rgba(255,255,255,.65);}
  .footer-bottom{border-top:1px solid rgba(255,255,255,.12);text-align:center;padding:16px;font-size:12px;color:rgba(255,255,255,.4);}

  
@media(max-width:720px){
    .nav-links{display:none;}
    .welcome{grid-template-columns:1fr;}
    .pillars{grid-template-columns:1fr;}
    .footer-inner{grid-template-columns:1fr;}
    .hero-content h1{font-size:30px;}
  }
</style>
</head>
<body>

<div id="site-header"></div>

<section class="section-wrap" style="text-align:center;padding-top:64px;padding-bottom:64px;">
  <span class="eyebrow" style="color:var(--gold)">Thank you</span>
  <h2>You&rsquo;re all set!</h2>
  <p style="color:var(--ink-soft);max-width:480px;margin:14px auto 28px;">
    Thanks for signing up to volunteer with Christian World Fellowship International.
    We&rsquo;ve received your application and will be in touch soon.
  </p>
  <a href="index.html" class="btn btn-gold">Back to Home</a>
</section>

<div id="site-footer"></div>

<script>
  fetch('header.html').then(function(r){return r.text();}).then(function(html){
    document.getElementById('site-header').innerHTML = html;
  });
  fetch('footer.html').then(function(r){return r.text();}).then(function(html){
    document.getElementById('site-footer').innerHTML = html;
  });
</script>
</body>
</html>
